[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asksql"
version = "0.1.0"
description = "Guarded natural-language-to-SQL over NYC taxi trips, with an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
asksql = "asksql.cli:main"

[tool.setuptools.packages.find]
include = ["asksql*"]

[tool.setuptools.package-data]
asksql = ["static/*.html", "resources/data/*.yaml", "resources/eval/*.jsonl", "resources/tests/fixtures/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# SQL strings in test tables read better on one line.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
